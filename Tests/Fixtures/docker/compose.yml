# Disposable containers for Runlet's Docker integration tests and acceptance checks.
# Start with: scripts/setup-fixtures.sh docker   Stop with: docker compose -p runlet-fixtures down
name: runlet-fixtures

services:
  # Standard Laravel application container (root user, writable mount).
  laravel:
    image: php:8.4-cli
    command: ["sleep", "infinity"]
    working_dir: /var/www/html
    environment:
      FIXTURE_SERVICE: laravel
    volumes:
      - ../laravel-app:/var/www/html

  # Restricted container: non-root user, read-only root filesystem and read-only app
  # mount, custom writable temporary directory, PHP 7.4.
  restricted:
    image: php:7.4-cli
    command: ["sleep", "infinity"]
    user: "1000:1000"
    read_only: true
    working_dir: /app
    tmpfs:
      - /scratch:uid=1000,gid=1000
    environment:
      FIXTURE_SERVICE: restricted
    volumes:
      - ../composer:/app:ro

  # Two replicas of the same service, to exercise ambiguous profile resolution.
  replicas:
    image: php:8.2-cli-alpine
    command: ["sleep", "infinity"]
    deploy:
      replicas: 2

  # Non-framework app booted by a Runlet project driver (.runlet/AcmeApiDriver.php).
  custom:
    image: php:8.4-cli
    command: ["sleep", "infinity"]
    working_dir: /var/www
    environment:
      FIXTURE_SERVICE: custom
    volumes:
      - ../custom-driver:/var/www

  # The WordPress fixture (../wordpress, on SQLite; scripts/setup-fixtures.sh generates it) in a
  # container, for WordPress runs on a Docker target: wp_mail() recording and interception (#192).
  wordpress:
    image: php:8.4-cli
    command: ["sleep", "infinity"]
    working_dir: /var/www/html
    environment:
      FIXTURE_SERVICE: wordpress
    volumes:
      - ../wordpress:/var/www/html

  # SSH host (OpenSSH + PHP 8.4) for SSH target tests, reachable on 127.0.0.1:2222 only.
  # See ssh/Dockerfile. The SSH tests start this service themselves when it isn't running.
  ssh:
    build: ./ssh
    image: runlet-fixtures-ssh:1
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - ../composer:/srv/app:ro
      - ../plain:/home/runlet/site/releases/20260101:ro

  # PHP 8.4 with the Excimer and SPX profiler extensions (see profiler/Dockerfile), for Profile
  # Run tests and screenshots: a Laravel application container whose PHP can profile.
  profiler:
    build: ./profiler
    image: runlet-fixtures-profiler:1
    command: ["sleep", "infinity"]
    working_dir: /var/www/html
    environment:
      FIXTURE_SERVICE: profiler
    volumes:
      - ../laravel-app:/var/www/html

  # Databases for live SQL tab checks (schema explorer #21, completion #128, Run All #129).
  # Started only with the `databases` profile (scripts/setup-fixtures.sh databases), on random
  # ports bound to 127.0.0.1, with throwaway fixture credentials and an empty `shop` database.
  # Both offer TLS (#140) with the throwaway certificates setup-fixtures.sh generates once, and
  # accept plain connections too. The script sets RUNLET_FIXTURE_TLS to the folder every worktree
  # shares (#176), so a run from another worktree doesn't recreate the containers; without it
  # the mount is ./tls (gitignored).
  mariadb:
    image: mariadb:11
    profiles: [databases]
    command: ["--ssl-ca=/tls/ca.crt", "--ssl-cert=/tls/server.crt", "--ssl-key=/tls/server.key"]
    environment:
      MARIADB_ROOT_PASSWORD: runlet-fixture
      MARIADB_DATABASE: shop
    volumes:
      - ${RUNLET_FIXTURE_TLS:-./tls}:/tls:ro
    ports:
      - "127.0.0.1::3306"

  postgres:
    image: postgres:14
    profiles: [databases]
    # PostgreSQL wants its key private and owned by its user: copied from the mount first.
    # Without the certificates it starts without TLS.
    entrypoint:
      - bash
      - -c
      - |
        if [ -f /tls/server.key ]; then
          install -d -o postgres -g postgres -m 700 /var/lib/postgresql/tls
          install -o postgres -g postgres -m 600 /tls/server.key /var/lib/postgresql/tls/server.key
          install -o postgres -g postgres -m 644 /tls/server.crt /tls/ca.crt /var/lib/postgresql/tls/
          set -- -c ssl=on -c ssl_cert_file=/var/lib/postgresql/tls/server.crt -c ssl_key_file=/var/lib/postgresql/tls/server.key -c ssl_ca_file=/var/lib/postgresql/tls/ca.crt
        fi
        exec docker-entrypoint.sh postgres "$$@"
    environment:
      POSTGRES_PASSWORD: runlet-fixture
      POSTGRES_DB: shop
    volumes:
      - ${RUNLET_FIXTURE_TLS:-./tls}:/tls:ro
    ports:
      - "127.0.0.1::5432"
