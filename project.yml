name: Runlet
options:
  bundleIdPrefix: dev.runlet
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH[config=Debug]: YES
    ONLY_ACTIVE_ARCH[config=Release]: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  RunletKit:
    path: Packages/RunletKit
  # Terminal emulator for the terminal panel (MIT). Pinned to the newest release that builds
  # with a stock Xcode: 1.12.0+ compiles a Metal shader (needs the separately downloaded
  # Metal Toolchain: xcodebuild -downloadComponent MetalToolchain) and 1.19.0+ adds a
  # build-tool plugin that xcodebuild refuses without -skipPackagePluginValidation.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.11.2
  # In-app updates (#233, MIT): download, EdDSA verification, extraction, quarantine release, and
  # install. App target only; RunletKit keeps no third-party Swift dependencies. Its command-line
  # tools (sign_update, generate_appcast) come with the package's artifact (docs/releasing.md).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Runlet:
    type: application
    platform: macOS
    sources:
      - path: Runlet
    dependencies:
      - package: RunletKit
        product: RunletCore
      - package: RunletKit
        product: RunletExecution
      - package: RunletKit
        product: RunletLanguage
      - package: SwiftTerm
        product: SwiftTerm
      - package: Sparkle
        product: Sparkle
      # The `runlet` command-line tool, in Contents/Helpers (installed as a link to it).
      - target: RunletCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    # Ad-hoc signing has no Team ID, so the hardened runtime's library validation refuses every
    # embedded dynamic framework (Sparkle, #233; checked: re-signing it ad hoc doesn't help). This
    # keeps the rest of the hardened runtime. Remove it once Developer ID signing (#24) gives the
    # app and Sparkle one Team ID.
    entitlements:
      path: Runlet/Runlet.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: true
    info:
      path: Runlet/Info.plist
      properties:
        # "Runlet", or "Runlet Dev" for Debug builds (#267): the menu bar, the Dock, About.
        CFBundleDisplayName: "$(RUNLET_APP_NAME)"
        CFBundleName: "$(RUNLET_APP_NAME)"
        # The data folder in Application Support (AppPaths.standard, #267).
        RunletDataFolder: "$(RUNLET_DATA_FOLDER)"
        # Set in the target's settings below (MARKETING_VERSION, CURRENT_PROJECT_VERSION,
        # RUNLET_PRERELEASE), so test builds can override them on the xcodebuild command line.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        RunletPrerelease: "$(RUNLET_PRERELEASE)"
        # In-app updates (#233): Sparkle reads the appcast on the appcast branch, accepts only a
        # feed and archives signed with the key below, and never checks on its own (Runlet does).
        SUFeedURL: https://raw.githubusercontent.com/filipac/runlet/appcast/appcast.xml
        SUPublicEDKey: "$(RUNLET_UPDATE_PUBLIC_KEY)"
        SUEnableAutomaticChecks: false
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Runlet MVP"
        LSMinimumSystemVersion: "15.0"
        CFBundleDocumentTypes:
          - CFBundleTypeName: PHP Source
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.php-script]
          - CFBundleTypeName: Runlet Workspace
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.runlet.workspace]
          # A folder dropped on the Dock icon (or `open -a Runlet <folder>`) opens as a
          # project. Rank None: Runlet is never offered as a folder's default app.
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.folder]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.runlet.workspace
            UTTypeDescription: Runlet Workspace
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [runlet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.runlet.Runlet
        PRODUCT_NAME: Runlet
        # The version. A pre-release sets RUNLET_PRERELEASE (e.g. beta.7, for v0.4.0-beta.7); a
        # release leaves it empty. CURRENT_PROJECT_VERSION goes up with every build that is
        # released, beta or not: Sparkle refuses an update whose build number is lower.
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "22"
        RUNLET_PRERELEASE: ""
        # The owner's update signing key (#233): the base64 EdDSA public key that `generate_keys`
        # prints (docs/releasing.md; #238). Empty: a build refuses to install updates and says
        # updates aren't set up. Never put the private key here or anywhere in the repository.
        RUNLET_UPDATE_PUBLIC_KEY: "mNcQhtB3hoKPnpddjNipccqXnhaBS3g5jSZTr6OR7zk="
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        # The app's name, icon, and data folder follow its bundle id (#267, #269): Runlet Dev
        # (dev.runlet.Runlet.dev, a Debug build from Xcode) gets its own, next to the installed
        # Runlet; every other bundle id (releases, and the .prshots and .websiteshots builds of
        # screenshot scripts) gets Runlet's. RUNLET_DATA_DIR still replaces the data folder.
        RUNLET_BUNDLE_KEY: "$(PRODUCT_BUNDLE_IDENTIFIER:identifier)"
        RUNLET_APP_NAME: "$(RUNLET_APP_NAME_$(RUNLET_BUNDLE_KEY):default=Runlet)"
        RUNLET_DATA_FOLDER: "$(RUNLET_DATA_FOLDER_$(RUNLET_BUNDLE_KEY):default=Runlet)"
        ASSETCATALOG_COMPILER_APPICON_NAME: "$(RUNLET_APP_ICON_$(RUNLET_BUNDLE_KEY):default=AppIcon)"
        RUNLET_APP_NAME_dev_runlet_Runlet_dev: Runlet Dev
        RUNLET_DATA_FOLDER_dev_runlet_Runlet_dev: Runlet Dev
        RUNLET_APP_ICON_dev_runlet_Runlet_dev: AppIconDev
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.runlet.Runlet.dev
    postBuildScripts:
      - name: Embed runner, sandbox, PHPantom, and Mago
        script: "\"$SRCROOT/scripts/embed-resources.sh\""
        basedOnDependencyAnalysis: false
  # `runlet`: opens folders, files, and workspaces in Runlet from a terminal (docs/cli.md).
  RunletCLI:
    type: tool
    platform: macOS
    productName: runlet
    sources:
      - path: RunletCLI
    dependencies:
      - package: RunletKit
        product: RunletCore
    settings:
      base:
        PRODUCT_NAME: runlet
        PRODUCT_MODULE_NAME: RunletCLI
        PRODUCT_BUNDLE_IDENTIFIER: dev.runlet.cli
        # An Info.plist inside the binary gives its signature the identifier dev.runlet.cli.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
  RunletUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: RunletUITests
    dependencies:
      - target: Runlet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.runlet.RunletUITests
        TEST_TARGET_NAME: Runlet
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Runlet:
    build:
      targets:
        Runlet: all
        RunletUITests: [test]
    run:
      # Metal API Validation off (#85): Core Animation's own line drawing sometimes issues a
      # draw with zero instances, which does nothing in a normal launch but stops a run from
      # Xcode on an assertion. Turn it back on in Edit Scheme when debugging GPU issues.
      enableGPUValidationMode: disabled
    test:
      # No automatic screenshots or screen recordings: they would capture the whole display.
      captureScreenshotsAutomatically: false
      deleteScreenshotsWhenEachTestSucceeds: true
      targets:
        - RunletUITests
