name: Runlet
options:
  bundleIdPrefix: dev.runlet
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH[config=Debug]: YES
    ONLY_ACTIVE_ARCH[config=Release]: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  RunletKit:
    path: Packages/RunletKit
  # Terminal emulator for the terminal panel (MIT). Pinned to the newest release that builds
  # with a stock Xcode: 1.12.0+ compiles a Metal shader (needs the separately downloaded
  # Metal Toolchain: xcodebuild -downloadComponent MetalToolchain) and 1.19.0+ adds a
  # build-tool plugin that xcodebuild refuses without -skipPackagePluginValidation.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.11.2
targets:
  Runlet:
    type: application
    platform: macOS
    sources:
      - path: Runlet
    dependencies:
      - package: RunletKit
        product: RunletCore
      - package: RunletKit
        product: RunletExecution
      - package: RunletKit
        product: RunletLanguage
      - package: SwiftTerm
        product: SwiftTerm
      # The `runlet` command-line tool, in Contents/Helpers (installed as a link to it).
      - target: RunletCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: Runlet/Info.plist
      properties:
        CFBundleDisplayName: Runlet
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "7"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Runlet MVP"
        LSMinimumSystemVersion: "26.0"
        CFBundleDocumentTypes:
          - CFBundleTypeName: PHP Source
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.php-script]
          - CFBundleTypeName: Runlet Workspace
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.runlet.workspace]
          # A folder dropped on the Dock icon (or `open -a Runlet <folder>`) opens as a
          # project. Rank None: Runlet is never offered as a folder's default app.
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.folder]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.runlet.workspace
            UTTypeDescription: Runlet Workspace
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [runlet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.runlet.Runlet
        PRODUCT_NAME: Runlet
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    postBuildScripts:
      - name: Embed runner, sandbox, and PHPantom
        script: "\"$SRCROOT/scripts/embed-resources.sh\""
        basedOnDependencyAnalysis: false
  # `runlet`: opens folders, files, and workspaces in Runlet from a terminal (docs/cli.md).
  RunletCLI:
    type: tool
    platform: macOS
    productName: runlet
    sources:
      - path: RunletCLI
    dependencies:
      - package: RunletKit
        product: RunletCore
    settings:
      base:
        PRODUCT_NAME: runlet
        PRODUCT_MODULE_NAME: RunletCLI
        PRODUCT_BUNDLE_IDENTIFIER: dev.runlet.cli
        # An Info.plist inside the binary gives its signature the identifier dev.runlet.cli.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
  RunletUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: RunletUITests
    dependencies:
      - target: Runlet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.runlet.RunletUITests
        TEST_TARGET_NAME: Runlet
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Runlet:
    build:
      targets:
        Runlet: all
        RunletUITests: [test]
    run:
      # Metal API Validation off (#85): Core Animation's own line drawing sometimes issues a
      # draw with zero instances, which does nothing in a normal launch but stops a run from
      # Xcode on an assertion. Turn it back on in Edit Scheme when debugging GPU issues.
      enableGPUValidationMode: disabled
    test:
      # No automatic screenshots or screen recordings: they would capture the whole display.
      captureScreenshotsAutomatically: false
      deleteScreenshotsWhenEachTestSucceeds: true
      targets:
        - RunletUITests
