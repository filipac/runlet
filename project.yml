name: Runlet
options:
  bundleIdPrefix: dev.runlet
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH[config=Debug]: YES
    ONLY_ACTIVE_ARCH[config=Release]: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  RunletKit:
    path: Packages/RunletKit
targets:
  Runlet:
    type: application
    platform: macOS
    sources:
      - path: Runlet
    dependencies:
      - package: RunletKit
        product: RunletCore
      - package: RunletKit
        product: RunletExecution
      - package: RunletKit
        product: RunletLanguage
    info:
      path: Runlet/Info.plist
      properties:
        CFBundleDisplayName: Runlet
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Runlet MVP"
        LSMinimumSystemVersion: "26.0"
        CFBundleDocumentTypes:
          - CFBundleTypeName: PHP Source
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.php-script]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.runlet.Runlet
        PRODUCT_NAME: Runlet
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    postBuildScripts:
      - name: Embed runner, sandbox, and PHPantom
        script: "\"$SRCROOT/scripts/embed-resources.sh\""
        basedOnDependencyAnalysis: false
  RunletUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: RunletUITests
    dependencies:
      - target: Runlet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.runlet.RunletUITests
        TEST_TARGET_NAME: Runlet
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Runlet:
    build:
      targets:
        Runlet: all
        RunletUITests: [test]
    test:
      targets:
        - RunletUITests
