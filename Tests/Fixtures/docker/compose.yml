# Disposable containers for Runlet's Docker integration tests and acceptance checks.
# Start with: scripts/setup-fixtures.sh docker   Stop with: docker compose -p runlet-fixtures down
name: runlet-fixtures

services:
  # Standard Laravel application container (root user, writable mount).
  laravel:
    image: php:8.4-cli
    command: ["sleep", "infinity"]
    working_dir: /var/www/html
    environment:
      FIXTURE_SERVICE: laravel
    volumes:
      - ../laravel-app:/var/www/html

  # Restricted container: non-root user, read-only root filesystem and read-only app
  # mount, custom writable temporary directory, PHP 7.4.
  restricted:
    image: php:7.4-cli
    command: ["sleep", "infinity"]
    user: "1000:1000"
    read_only: true
    working_dir: /app
    tmpfs:
      - /scratch:uid=1000,gid=1000
    environment:
      FIXTURE_SERVICE: restricted
    volumes:
      - ../composer:/app:ro

  # Two replicas of the same service, to exercise ambiguous profile resolution.
  replicas:
    image: php:8.2-cli-alpine
    command: ["sleep", "infinity"]
    deploy:
      replicas: 2

  # Non-framework app booted by a Runlet project driver (.runlet/AcmeApiDriver.php).
  custom:
    image: php:8.4-cli
    command: ["sleep", "infinity"]
    working_dir: /var/www
    environment:
      FIXTURE_SERVICE: custom
    volumes:
      - ../custom-driver:/var/www

  # SSH host (OpenSSH + PHP 8.4) for SSH target tests, reachable on 127.0.0.1:2222 only.
  # See ssh/Dockerfile. The SSH tests start this service themselves when it isn't running.
  ssh:
    build: ./ssh
    image: runlet-fixtures-ssh:1
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - ../composer:/srv/app:ro
      - ../plain:/home/runlet/site/releases/20260101:ro

  # PHP 8.4 with the Excimer and SPX profiler extensions (see profiler/Dockerfile), for Profile
  # Run tests and screenshots: a Laravel application container whose PHP can profile.
  profiler:
    build: ./profiler
    image: runlet-fixtures-profiler:1
    command: ["sleep", "infinity"]
    working_dir: /var/www/html
    environment:
      FIXTURE_SERVICE: profiler
    volumes:
      - ../laravel-app:/var/www/html

  # Databases for live SQL tab checks (schema explorer #21, completion #128, Run All #129).
  # Started only with the `databases` profile (scripts/setup-fixtures.sh databases), on random
  # ports bound to 127.0.0.1, with throwaway fixture credentials and an empty `shop` database.
  mariadb:
    image: mariadb:11
    profiles: [databases]
    environment:
      MARIADB_ROOT_PASSWORD: runlet-fixture
      MARIADB_DATABASE: shop
    ports:
      - "127.0.0.1::3306"

  postgres:
    image: postgres:14
    profiles: [databases]
    environment:
      POSTGRES_PASSWORD: runlet-fixture
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1::5432"
