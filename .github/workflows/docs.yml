# Builds the documentation website on pull requests (#287), the same way the Website workflow
# (pages.yml) does on main: the build fails on unclassified pages, dead links, and links to files
# that aren't in the repository. The assembled site (landing page at /, docs at /docs/) is
# uploaded as the docs-site artifact for a preview.
name: Docs

on:
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      # docs/release-notes.md is generated from CHANGELOG.md's version sections (#291).
      - "CHANGELOG.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/assemble-site.sh"
      - ".github/workflows/docs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the docs
        run: npm run docs:build
      - name: Assemble the site
        run: scripts/assemble-site.sh _site
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site
          retention-days: 14
